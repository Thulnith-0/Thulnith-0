<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40" role="img" aria-label="Facebook" font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Facebook</title><style>
