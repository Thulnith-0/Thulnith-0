<svg xmlns="http://www.w3.org/2000/svg" width="433" height="286" viewBox="0 0 433 286" role="img" aria-label="Clamp (private): A fast, private video downloader. Desktop app at v3.4.0 with auto-updates, plus an Android companion. Everything runs on-device, with no account." font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Clamp (private): A fast, private video downloader. Desktop app at v3.4.0 with auto-updates, plus an Android companion. Everything runs on-device, with no account.</title><style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
