<svg xmlns="http://www.w3.org/2000/svg" width="433" height="286" viewBox="0 0 433 286" role="img" aria-label="Sinhala TTS (private): Native-accent Sinhala text-to-speech fine-tuned from F5-TTS. It gets the schwa right where existing Sinhala systems don&#x27;t. Round-trip CER cut from 123.1% to 55.4%." font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Sinhala TTS (private): Native-accent Sinhala text-to-speech fine-tuned from F5-TTS. It gets the schwa right where existing Sinhala systems don&#x27;t. Round-trip CER cut from 123.1% to 55.4%.</title><style>
