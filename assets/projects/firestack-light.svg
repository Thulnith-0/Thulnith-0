<svg xmlns="http://www.w3.org/2000/svg" width="433" height="286" viewBox="0 0 433 286" role="img" aria-label="FireStack (private): Windows optimizer that tunes BlueStacks for Free Fire. Built on .NET 8 with WPF and an MVVM architecture." font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>FireStack (private): Windows optimizer that tunes BlueStacks for Free Fire. Built on .NET 8 with WPF and an MVVM architecture.</title><style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gd{transform-box:fill-box;transform-origin:center;animation:gd 4.2s cubic-bezier(.3,0,.3,1) 1s infinite}
