<svg xmlns="http://www.w3.org/2000/svg" width="433" height="286" viewBox="0 0 433 286" role="img" aria-label="Hydra Panel (private): C# desktop control panel with license-key sign-in and account registration, built on a custom Guna UI interface." font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Hydra Panel (private): C# desktop control panel with license-key sign-in and account registration, built on a custom Guna UI interface.</title><style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gd{transform-box:fill-box;transform-origin:center;animation:gd 4.2s cubic-bezier(.3,0,.3,1) 1s infinite}
.gd2{animation-delay:1.1s}.gd3{animation-delay:1.2s}.gd4{animation-delay:1.3s}
@keyframes gd{0%,24%,100%{transform:none}8%{transform:translateY(-5px)}16%{transform:translateY(1px)}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.glp{animation:swp 11s cubic-bezier(.45,0,.2,1) 3.85s infinite}@keyframes swp{0%{transform:translateX(0)}30%,100%{transform:translateX(708px)}}</style><defs><linearGradient id="glp" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="gcp"><rect x="0.5" y="0.5" width="432" height="285" rx="22"/></clipPath></defs><rect x="0.5" y="0.5" width="432" height="285" rx="22" fill="#16181d" stroke="#262931"/><g clip-path="url(#gcp)"><rect class="glp" x="-137.7" y="-1.5" width="138.2" height="289" fill="url(#glp)"/></g><g class="f d1"><text x="28.0" y="44.0" font-size="11.5" font-weight="700" fill="#2997ff" letter-spacing="1.6">DESKTOP · WINDOWS</text></g><g class="f d1"><rect x="341.5" y="26" width="63.5" height="26" rx="13" fill="none" stroke="#2c2f36"/><text x="373.3" y="43.5" font-size="11.5" font-weight="600" fill="#a1a1a6" text-anchor="middle">Private</text></g><g class="f d2"><text x="27.0" y="92.0" font-size="27" font-weight="700" fill="#f5f5f7" letter-spacing="-0.7">Hydra Panel</text></g><g class="f d3"><text x="28.0" y="126.0" font-size="14.5" font-weight="400" fill="#a1a1a6">C# desktop control panel with license-key sign-in and</text><text x="28.0" y="148.0" font-size="14.5" font-weight="400" fill="#a1a1a6">account registration, built on a custom Guna UI</text><text x="28.0" y="170.0" font-size="14.5" font-weight="400" fill="#a1a1a6">interface.</text></g><g class="f d4"><rect x="28.0" y="230.0" width="39.6" height="28" rx="14.0" fill="#1f2228" stroke="#2c2f36"/><text x="40.0" y="248.3" font-size="12" font-weight="500" fill="#f5f5f7">C#</text><rect x="75.6" y="230.0" width="83.6" height="28" rx="14.0" fill="#1f2228" stroke="#2c2f36"/><text x="87.6" y="248.3" font-size="12" font-weight="500" fill="#f5f5f7">WinForms</text><rect x="167.2" y="230.0" width="69.9" height="28" rx="14.0" fill="#1f2