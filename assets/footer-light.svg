<svg xmlns="http://www.w3.org/2000/svg" width="880" height="110" viewBox="0 0 880 110" role="img" aria-label="Designed and built by Thulnith Perera" font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Designed and built by Thulnith Perera</title><style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gd{transform-box:fill-box;transform-origin:center;animation:gd 4.2s cubic-bezier(.3,0,.3,1) 1s infinite}
.gd2{animation-delay:1.1s}.gd3{animation-delay:1.2s}.gd4{animation-delay:1.3s}
@keyframes gd{0%,24%,100%{transform:none}8%{transform:translateY(-5px)}16%{transform:translateY(1px)}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs></defs><line x1="0" y1="1" x2="880" y2="1" stroke="#d2d2d7"/><g class="f d1"><circle class="gd gd1" cx="420.5" cy="52.0" r="4" fill="#4285F4"/><circle class="gd gd2" cx="433.5" cy="52.0" r="4" fill="#EA4335"/><circle class="gd gd3" cx="446.5" cy="52.0" r="4" fill="#FBBC04"/><circle class="gd gd4" cx="459.5" cy="52.0" r="4" fill="#34A853"/></g><g class="f d2"><text x="440.0" y="88.0" font-size="13" font-weight="500" fill="#86868b" text-anchor="middle">Designed and built by Thulnith Perera. Cards refresh every 12 hours.</text></g></svg>
