<svg xmlns="http://www.w3.org/2000/svg" width="433" height="250" viewBox="0 0 433 250" role="img" aria-label="Current streak 1 days, longest 17" font-family="-apple-system, BlinkMacSystemFont, &#x27;SF Pro Display&#x27;, &#x27;Segoe UI Variable Display&#x27;, &#x27;Segoe UI&#x27;, Inter, Roboto, &#x27;Helvetica Neue&#x27;, Arial, sans-serif"><title>Current streak 1 days, longest 17</title><style>
.f{animation:up .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gd{transform-box:fill-box;transform-origin:center;animation:gd 4.2s cubic-bezier(.3,0,.3,1) 1s infinite}
.gd2{animation-delay:1.1s}.gd3{animation-delay:1.2s}.gd4{animation-delay:1.3s}
@keyframes gd{0%,24%,100%{transform:none}8%{transform:translateY(-5px)}16%{transform:translateY(1px)}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pl{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.ring{stroke-dasharray:24.4 414.7;animation:ring 1.6s cubic-bezier(.2,.7,.2,1) .3s backwards}@keyframes ring{from{stroke-dasharray:0 414.7}}</style><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><rect x="0.5" y="0.5" width="432" height="249" rx="22" fill="#16181d" stroke="#262931"/><g class="f d1"><text x="28.0" y="44.0" font-size="11.5" font-weight="700" fill="#2997ff" letter-spacing="1.6">STREAK</text></g><g class="f d2"><text x="26.0" y="104.0" font-size="56" font-weight="700" fill="#f5f5f7" letter-spacing="-2">1</text><text x="69.1" y="104.0" font-size="18" font-weight="600" fill="#a1a1a6">days</text><text x="28.0" y="130.0" font-size="13.5" font-weight="500" fill="#a1a1a6">Current streak</text></g><line x1="28" y1="152" x2="243" y2="152" stroke="#2c2f36"/><g class="f d3"><text x="28.0" y="196.0" font-size="26" font-weight="700" fill="#f5f5f7" letter-spacing="-0.8">17</text><text x="28.0" y="220.0" font-size="12.5" font-weight="500" fill="#a1a1a6">Longest</text><text x="124.0" y="196.0" font-size="26" font-weight="700" fill="#f5f5f7" letter-spacing="-0.8">1,161</text><text x="124.0" y="220.0" font-size="12.5" font-weight="500" fill="#a1a1a6">All-time</text></g><circle cx="335" cy="125" r="66" fill="none" stroke="#2a2d34" stroke-width="16"/><circle class="ring" cx="335" cy="125" r="66" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 335 125)"/><g class="f d4"><text x="335.0" y="131.0" font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="middle">6%</text><text x="335.0" y="150.0" font-size="11" font-weight="500" fill="#a1a1a6" text-anchor="middle">of best</text></g></svg>
