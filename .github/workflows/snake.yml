name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake files
        uses: Platane/snk@v3
        with:
          github_user_name: Thulnith-0
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=8B5CF6&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=FF4DFF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake.gif?palette=github-dark&color_snake=FF4DFF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
