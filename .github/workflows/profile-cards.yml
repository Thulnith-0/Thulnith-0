name: Profile cards

# Builds the live README cards (stats, streak, languages, activity, achievements,
# daily joke) and the contribution snake, then publishes them to the `output`
# branch that README.md links to. Self-hosted, so no third-party card servers.
#
# Optional: add a repository secret PROFILE_TOKEN (a fine-grained token with
# read access to your repositories) so private repos count towards languages.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/profile/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python .github/profile/build_live.py dist

      - name: Build snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c6dcfa,#8ab9f5,#4a90e8,#0071e3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#1c2129,#123a66,#1a5fb4,#2b7fe0,#2997ff

      - name: Frame snake
        run: python .github/profile/wrap_snake.py dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
